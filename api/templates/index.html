<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSV → Kafka → Neo4j Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="container mt-5">

    <div class="hero">

        <h1>
            <i class="fa-solid fa-database"></i>
            CSV → Kafka → Neo4j AI Chatbot
        </h1>

        <p>
            Upload • Analyze • Query • Visualize
        </p>

    </div>

<div class="upload-box">

<div class="card shadow-lg border-0 rounded-4 p-4 mt-4">

    <h4 class="text-center mb-4">
        <i class="fa-solid fa-cloud-arrow-up text-primary"></i>
        Upload CSV Dataset
    </h4>

    <input
        type="file"
        id="csvFile"
        class="form-control mb-3"
        accept=".csv"
    >

    <div class="text-center">
        <button
            id="uploadBtn"
            class="btn btn-primary btn-lg px-5">
            <i class="fa-solid fa-upload"></i>
            Upload CSV
        </button>
        <div id="loadingSpinner" class="text-center mt-3" style="display:none;">
        <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Uploading CSV...</p>
</div>
    </div>

    <p
        id="status"
        class="text-center mt-3 fw-bold">
    </p>

</div>  
<div id="summaryCards" class="row mt-4" style="display:none;">

    <div class="col-md-4 mb-3">
        <div class="card text-center shadow-sm border-0">
            <div class="card-body">
                <i class="fa-solid fa-file-csv fa-2x text-primary mb-2"></i>
                <h6>File Name</h6>
                <h5 id="fileName">-</h5>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card text-center shadow-sm border-0">
            <div class="card-body">
                <i class="fa-solid fa-table fa-2x text-success mb-2"></i>
                <h6>Rows</h6>
                <h5 id="rowCount">0</h5>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card text-center shadow-sm border-0">
            <div class="card-body">
                <i class="fa-solid fa-columns fa-2x text-warning mb-2"></i>
                <h6>Columns</h6>
                <h5 id="columnCount">0</h5>
            </div>
        </div>
    </div>

</div>

<hr>


<div class="card shadow-lg border-0 rounded-4 mt-4">

    <div class="card-header bg-primary text-white">

        <h4 class="mb-0">
            <i class="fa-solid fa-table"></i>
            CSV Preview
        </h4>

    </div>

    <div class="card-body">

        <div id="preview"></div>

    </div>

</div>
<hr>

<div class="card shadow-lg border-0 rounded-4 mt-4">

    <div class="card-header bg-success text-white">

        <h4 class="mb-0">
            <i class="fa-solid fa-robot"></i>
            AI Assistant
        </h4>

    </div>

    <div class="card-body">

        <div class="input-group mb-3">

            <input
                type="text"
                id="question"
                class="form-control"
                placeholder="Ask anything about your CSV dataset..."
            >

            <button
                class="btn btn-success"
                id="askBtn">

                <i class="fa-solid fa-paper-plane"></i>
                Ask AI

            </button>

        </div>

        <div id="answerCard" class="alert alert-light border" style="display:none;">

            <h6>
                🤖 AI Response
            </h6>

            <div id="answer"></div>

        </div>

    </div>

</div>



</div>

<script src="/static/script.js"></script>
<footer class="text-center mt-5 mb-4">

    <hr>

    <p class="text-muted">
        🚀 CSV → Kafka → Neo4j AI Chatbot
    </p>

    <small class="text-secondary">
        Hackathon Project • Team 3 • Built with FastAPI, Kafka & Neo4j
    </small>

</footer>

</body>

</html>
